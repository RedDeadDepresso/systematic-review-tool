services:
  redis:
    image: redis:8.4.0-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:18.0-alpine3.22
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - ./.env

  django:
    image: ghcr.io/2739548r/slrt-django:latest
    command: sh -c "python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      daphne -b 0.0.0.0 -p 8000 backend.asgi:application"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/backend
    depends_on:
      - postgres
    env_file:
      - ./.env

  celery:
    image: ghcr.io/2739548r/slrt-django:latest
    command: sh -c "celery -A backend worker --loglevel=info"
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/backend
    depends_on:
      - redis
      - django
    env_file:
      - ./dev.env
    environment:
      - C_FORCE_ROOT="true"

  react:
    image: ghcr.io/2739548r/slrt-react:latest
    command: sh -c "pnpm build"
    volumes:
      - frontend-dist:/frontend/dist # <-- mount the volume inside build container

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - frontend-dist:/usr/share/nginx/html
    env_file:
      - ./.env
    depends_on:
      - django

  certbot:
    image: certbot/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    env_file:
      - ./.env
    depends_on:
      - nginx

volumes:
  frontend-dist:
  postgres-data:
