services:
  redis:
    image: redis:8.4.0-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:18.0-alpine3.22
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - ./.env.production

  django:
    image: ghcr.io/2739548r/slrt-django:latest
    command: sh -c "python manage.py makemigrations &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      daphne -b 0.0.0.0 -p 8000 backend.asgi:application"
    ports:
      - "8000:8000"
    volumes:
      - media-data:/backend/media
      - static-data:/backend/staticfiles
    depends_on:
      - postgres
    env_file:
      - ./.env.production

  celery:
    image: ghcr.io/2739548r/slrt-django:latest
    command: sh -c "celery -A backend worker --loglevel=info"
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - django
    env_file:
      - ./.env.production
    environment:
      - C_FORCE_ROOT="true"

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - media-data:/backend/media
      - static-data:/backend/staticfiles
      - letsencrypt-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    env_file:
      - ./.env.production
    depends_on:
      - django

  certbot:
    image: certbot/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - letsencrypt-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    env_file:
      - ./.env.production
    depends_on:
      - nginx

volumes:
  postgres-data:
  media-data:
  static-data:
  letsencrypt-certs:
  certbot-www:
