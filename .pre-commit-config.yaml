repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff-check
        args: ["--fix", "backend"]
        files: ^backend/
      - id: ruff-format
        args: ["backend"]
        files: ^backend/

  - repo: local
    hooks:
      - id: eslint
        name: Frontend Eslint
        entry: bash -c "cd frontend && pnpm lint"
        language: system
        stages: [pre-commit]
        files: ^frontend/

  - repo: local
    hooks:
      - id: prettier
        name: Frontend Prettier
        entry: bash -c "cd frontend && pnpm format"
        language: system
        stages: [pre-commit]
        files: ^frontend/