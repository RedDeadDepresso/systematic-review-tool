stages:
  - lint
  - test
  - deploy

# =====================================================
# GLOBAL VARIABLES
# =====================================================

variables:
  DOCKER_CONFIG: /kaniko/.docker

  DEPLOY_USER: $DEPLOY_USER_CI
  DEPLOY_HOST: $DEPLOY_HOST_CI
  DEPLOY_PATH: /home/$DEPLOY_USER_CI/app

  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PNPM_STORE_PATH: "$CI_PROJECT_DIR/.pnpm-store"

# =====================================================
# BACKEND LINT
# =====================================================

lint-backend:
  stage: lint
  image: python:3.13-alpine
  cache:
    key:
      files:
        - backend/pyproject.toml
        - backend/uv.lock
    paths:
      - .cache/uv/
  before_script:
    - apk add --no-cache build-base
    - pip install uv ruff
  script:
    - cd backend
    - ruff check .
    - ruff format --check .
  rules:
    - changes:
        - backend/**

# =====================================================
# FRONTEND LINT
# =====================================================

lint-frontend:
  stage: lint
  image: node:24-alpine
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir $PNPM_STORE_PATH
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm format
  rules:
    - changes:
        - frontend/**

# =====================================================
# BACKEND TEST
# =====================================================

test-backend:
  stage: test
  image: python:3.13-alpine
  services:
    - name: postgres:18.0-alpine3.22
      alias: db
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    DATABASE_URL: postgres://postgres:postgres@db:5432/test_db
    DJANGO_SETTINGS_MODULE: config.settings.test
  cache:
    key:
      files:
        - backend/pyproject.toml
        - backend/uv.lock
    paths:
      - .cache/uv/
  before_script:
    - apk add --no-cache build-base libpq
    - pip install uv
    - cd backend
    - uv sync --frozen
    - . .venv/bin/activate
  script:
    - pytest -n auto --cov=slrt_project --cov-report=xml --cov-report=term
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
  rules:
    - changes:
        - backend/**

# =====================================================
# FRONTEND TEST
# =====================================================

test-frontend:
  stage: test
  image: node:24-alpine
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir $PNPM_STORE_PATH
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm test --coverage
  rules:
    - changes:
        - frontend/**

# =====================================================
# DEPLOY
# =====================================================

deploy-prod:
  stage: deploy
  image: alpine:latest
  needs:
    - job: lint-backend
      optional: true
    - job: test-frontend
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache openssh docker-cli-compose
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        cd $DEPLOY_PATH &&
        git pull &&
        docker compose -f docker-compose.production.yml up --build -d --remove-orphans
      "
