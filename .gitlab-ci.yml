stages:
  - lint
  - test
  - deploy

# =====================================================
# GLOBAL VARIABLES
# =====================================================

variables:
  GHCR_REGISTRY: ghcr.io
  DJANGO_IMAGE: ghcr.io/$GHCR_USERNAME/slrt-django
  NGINX_IMAGE: ghcr.io/$GHCR_USERNAME/slrt-nginx
  DOCKER_CONFIG: /kaniko/.docker

  DEPLOY_USER: ubuntu
  DEPLOY_HOST: $EC2_HOST
  DEPLOY_PATH: /srv/app

  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PNPM_STORE_PATH: "$CI_PROJECT_DIR/.pnpm-store"

# =====================================================
# BACKEND LINT
# =====================================================

lint-backend:
  stage: lint
  image: python:3.13-alpine
  cache:
    key:
      files:
        - backend/pyproject.toml
        - backend/uv.lock
    paths:
      - .cache/uv/
  before_script:
    - apk add --no-cache build-base
    - pip install uv ruff
  script:
    - cd backend
    - ruff check .
    - ruff format --check .

# =====================================================
# FRONTEND LINT
# =====================================================

lint-frontend:
  stage: lint
  image: node:24-alpine
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir $PNPM_STORE_PATH
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm format

# =====================================================
# FRONTEND TEST
# =====================================================

test-frontend:
  stage: test
  image: node:24-alpine
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir $PNPM_STORE_PATH
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm test --coverage

# =====================================================
# DEPLOY
# =====================================================

deploy-prod:
  stage: deploy
  image: alpine:latest
  needs: ["lint-backend", "test-frontend"]
  before_script:
    - apk add --no-cache openssh docker-cli-compose
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        echo '$GHCR_TOKEN' | docker login ghcr.io -u $GHCR_USERNAME --password-stdin &&
        cd $DEPLOY_PATH &&
        git pull &&
        docker compose -f docker-compose.production.yml up --build -d --remove-orphans
      "
  only:
    - main
