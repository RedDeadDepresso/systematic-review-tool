stages:
  - lint
  - test
  - build
  - deploy

# =====================================================
# GLOBAL VARIABLES
# =====================================================

variables:
  GHCR_REGISTRY: ghcr.io
  DJANGO_IMAGE: ghcr.io/$GHCR_USERNAME/slrt-django
  NGINX_IMAGE: ghcr.io/$GHCR_USERNAME/slrt-nginx
  DOCKER_CONFIG: /kaniko/.docker

  DEPLOY_USER: ubuntu
  DEPLOY_HOST: $EC2_HOST
  DEPLOY_PATH: /srv/app

  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PNPM_STORE_PATH: "$CI_PROJECT_DIR/.pnpm-store"

# =====================================================
# BACKEND LINT
# =====================================================

lint-backend:
  stage: lint
  image: python:3.13-alpine
  cache:
    key:
      files:
        - backend/pyproject.toml
        - backend/uv.lock
    paths:
      - .cache/uv/
  before_script:
    - apk add --no-cache build-base
    - pip install uv ruff
  script:
    - cd backend
    - ruff check .
    - ruff format --check .

# =====================================================
# FRONTEND LINT
# =====================================================

lint-frontend:
  stage: lint
  image: node:24-alpine
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir $PNPM_STORE_PATH
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm format

# =====================================================
# BACKEND TEST
# =====================================================

test-backend:
  stage: test
  image: python:3.13-alpine
  services:
    - name: postgres:18-alpine
      alias: db
  cache:
    key:
      files:
        - backend/pyproject.toml
        - backend/uv.lock
    paths:
      - .cache/uv/
  variables:
    DATABASE_URL: postgres://postgres:postgres@db:5432/test_db
    DJANGO_SETTINGS_MODULE: config.settings.test
  before_script:
    - apk add --no-cache build-base libpq
    - pip install uv
    - cd backend
    - uv sync --frozen
  script:
    - pytest --cov=. --cov-report=xml
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

# =====================================================
# FRONTEND TEST
# =====================================================

test-frontend:
  stage: test
  image: node:24-alpine
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir $PNPM_STORE_PATH
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm test --coverage

# =====================================================
# BUILD DJANGO IMAGE
# =====================================================

build-django:
  stage: build
  needs: ["lint-backend", "test-backend"]
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p $DOCKER_CONFIG
    - |
      cat <<EOF > $DOCKER_CONFIG/config.json
      {
        "auths": {
          "ghcr.io": {
            "username": "$GHCR_USERNAME",
            "password": "$GHCR_TOKEN"
          }
        }
      }
      EOF
    - /kaniko/executor \
        --context ./backend \
        --dockerfile ./backend/compose/production/django/Dockerfile \
        --destination $DJANGO_IMAGE:$CI_COMMIT_SHORT_SHA \
        --destination $DJANGO_IMAGE:latest \
        --cache=true \
        --cache-repo=$DJANGO_IMAGE-cache
  only:
    - main

# =====================================================
# BUILD NGINX/FRONTEND IMAGE
# =====================================================

build-nginx:
  stage: build
  needs: ["lint-frontend", "test-frontend"]
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p $DOCKER_CONFIG
    - |
      cat <<EOF > $DOCKER_CONFIG/config.json
      {
        "auths": {
          "ghcr.io": {
            "username": "$GHCR_USERNAME",
            "password": "$GHCR_TOKEN"
          }
        }
      }
      EOF
    - /kaniko/executor \
        --context . \
        --dockerfile nginx/Dockerfile \
        --destination $NGINX_IMAGE:$CI_COMMIT_SHORT_SHA \
        --destination $NGINX_IMAGE:latest \
        --cache=true \
        --cache-repo=$NGINX_IMAGE-cache \
        --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL \
        --build-arg VITE_WS_URL=$VITE_WS_URL
  only:
    - main

# =====================================================
# DEPLOY
# =====================================================

deploy-prod:
  stage: deploy
  image: alpine:latest
  needs: ["build-django", "build-nginx"]
  before_script:
    - apk add --no-cache openssh docker-cli-compose
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        echo '$GHCR_TOKEN' | docker login ghcr.io -u $GHCR_USERNAME --password-stdin &&
        cd $DEPLOY_PATH &&
        docker compose -f docker-compose.production.yml pull &&
        docker compose -f docker-compose.production.yml up -d --remove-orphans
      "
  only:
    - main
