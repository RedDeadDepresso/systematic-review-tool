stages:
  - build
  - deploy

variables:
  GHCR_REGISTRY: ghcr.io
  DJANGO_IMAGE: ghcr.io/$GHCR_USERNAME/slrt-django
  REACT_IMAGE: ghcr.io/$GHCR_USERNAME/slrt-react
  DOCKER_CONFIG: /kaniko/.docker
  DEPLOY_USER: ubuntu
  DEPLOY_HOST: $EC2_HOST
  DEPLOY_PATH: /srv/app

# -------------------------
# Build Django Docker image
# -------------------------
build-django:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p $DOCKER_CONFIG
    - |
      cat <<EOF > $DOCKER_CONFIG/config.json
      {
        "auths": {
          "ghcr.io": {
            "username": "$GHCR_USERNAME",
            "password": "$GHCR_TOKEN"
          }
        }
      }
      EOF
    - /kaniko/executor
        --context ./backend
        --dockerfile ./backend/Dockerfile
        --destination $DJANGO_IMAGE:$CI_COMMIT_SHORT_SHA
        --destination $DJANGO_IMAGE:latest

# -------------------------
# Build React Docker image
# -------------------------
build-react:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p $DOCKER_CONFIG
    - |
      cat <<EOF > $DOCKER_CONFIG/config.json
      {
        "auths": {
          "ghcr.io": {
            "username": "$GHCR_USERNAME",
            "password": "$GHCR_TOKEN"
          }
        }
      }
      EOF
    - /kaniko/executor
        --context ./frontend
        --dockerfile ./frontend/Dockerfile
        --destination $REACT_IMAGE:$CI_COMMIT_SHORT_SHA
        --destination $REACT_IMAGE:latest

# -------------------------
# Deploy to production (EC2)
# -------------------------
deploy-prod:
  stage: deploy
  image: alpine:latest
  before_script:
    # Install SSH client only
    - apk add --no-cache openssh
    # Start SSH agent and add private key
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST "
        # Log in to GHCR on EC2
        echo '$GHCR_TOKEN' | docker login ghcr.io -u $GHCR_USERNAME --password-stdin &&
        cd $DEPLOY_PATH &&
        docker compose pull &&
        docker compose up -d
      "
  only:
    - main
