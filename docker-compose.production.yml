volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_traefik: {}
  production_django_media: {}
  production_django_static: {}

  production_redis_data: {}

services:
  django: &django
    build:
      context: ./backend
      dockerfile: ./compose/production/django/Dockerfile

    image: slrt_project_production_django
    volumes:
      - production_django_media:/app/slrt_project/media
      - production_django_static:/app/slrt_project/staticfiles
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
      - ./.envs/.production/.react
    command: /start

  postgres:
    build:
      context: ./backend
      dockerfile: ./compose/production/postgres/Dockerfile
    image: slrt_project_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql/18/docker
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  traefik:
    build:
      context: ./backend
      dockerfile: ./compose/production/traefik/Dockerfile
    image: slrt_project_production_traefik
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:5555:5555"

  redis:
    image: docker.io/redis:7.2

    volumes:
      - production_redis_data:/data

  celeryworker:
    <<: *django
    image: slrt_project_production_celeryworker
    command: /start-celeryworker

  # celerybeat:
  #   <<: *django
  #   image: slrt_project_production_celerybeat
  #   command: /start-celerybeat

  flower:
    <<: *django
    image: slrt_project_production_flower
    command: /start-flower

  nginx:
    build:
      context: .
      dockerfile: ./backend/compose/production/nginx/Dockerfile
    image: slrt_project_production_nginx
    depends_on:
      - django
    volumes:
      - production_django_media:/usr/share/nginx/media:ro
      - production_django_static:/usr/share/nginx/staticfiles:ro
    env_file:
      - ./.envs/.production/.react
