server {
  listen       80;
  server_name  localhost;

  # Django media
  location /media/ {
    alias /usr/share/nginx/media/;
  }

  # Django static
  location /static/ {
    alias /usr/share/nginx/staticfiles/;
  }

  # React frontend
  location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri /index.html;
  }
}
